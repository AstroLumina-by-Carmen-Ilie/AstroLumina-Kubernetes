apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: astrolumina-ingress
  namespace: astrolumina-dev
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: development
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "false"
spec:
  rules:
    - host: dev.astrolumina.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api/astrology
            pathType: Prefix
            backend:
              service:
                name: astrology-api
                port:
                  number: 3031
          - path: /api/booking
            pathType: Prefix
            backend:
              service:
                name: booking-api
                port:
                  number: 3033
          - path: /api/payment
            pathType: Prefix
            backend:
              service:
                name: payment-api
                port:
                  number: 3032
