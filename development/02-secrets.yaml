---
# Placeholder secrets for development. Real values are injected by Doppler at
# deploy time (see 03-doppler-secrets.yaml). EVERY key listed in the
# DopplerSecret sync lists must exist here too — a missing key means
# CreateContainerConfigError (secretKeyRef is mandatory), NOT a running pod.
# Values are fake but format-plausible so the apps boot until Doppler syncs.
apiVersion: v1
kind: Secret
metadata:
  name: env-frontend-secrets
  namespace: astrolumina-dev
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: astrolumina
    environment: development
type: Opaque
stringData:
  NODE_ENV: development
  FRONTEND_SERVER_PORT: "80"
  FRONTEND_SERVER_DNS: REPLACE_WITH_DEV_FRONTEND_DNS
  ASTROLOGY_API_SERVER_PORT: "3031"
  ASTROLOGY_API_SERVER_DNS: REPLACE_WITH_DEV_ASTROLOGY_DNS
  BOOKING_API_SERVER_PORT: "3033"
  BOOKING_API_SERVER_DNS: REPLACE_WITH_DEV_BOOKING_DNS
  PAYMENT_API_SERVER_PORT: "3032"
  PAYMENT_API_SERVER_DNS: REPLACE_WITH_DEV_PAYMENT_DNS
  CORS_ORIGINS: http://placeholder.local
  ASTROLOGICAL_API_URL: http://placeholder.local
  PAYMENT_API_URL: http://placeholder.local
  BOOKING_API_URL: http://placeholder.local
  ASTROLOGICAL_API_K8S_URL: http://placeholder.local
  PAYMENT_API_K8S_URL: http://placeholder.local
  BOOKING_API_K8S_URL: http://placeholder.local
  STRIPE_PK: REPLACE_WITH_DEV_STRIPE_PK
  R2_BASE_URL: http://placeholder.local
  FRONTEND_SENTRY_DSN: https://REPLACE_WITH_DEV_FRONTEND_SENTRY_DSN@sentry.io/0
---
