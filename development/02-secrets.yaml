---
# Placeholder secrets for development. Real values are injected by Doppler at
# deploy time (see doppler/development-doppler-secret.yaml). Keys follow the
# exact environment variable names the apps validate at startup.
apiVersion: v1
kind: Secret
metadata:
  name: env-frontend-secrets
  namespace: astrolumina-dev
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: astrolumina
    environment: development
type: Opaque
stringData:
  FRONTEND_SENTRY_DSN: https://REPLACE_WITH_DEV_FRONTEND_SENTRY_DSN@sentry.io/0
---
apiVersion: v1
kind: Secret
metadata:
  name: env-astrology-api-secrets
  namespace: astrolumina-dev
  labels:
    app.kubernetes.io/name: astrology-api
    app.kubernetes.io/part-of: astrolumina
    environment: development
type: Opaque
stringData:
  ASTROLOGER_API_KEY: REPLACE_WITH_RAPIDAPI_KEY
  ASTROLOGY_API_SENTRY_DSN: https://REPLACE_WITH_DEV_ASTROLOGY_SENTRY_DSN@sentry.io/0
---
apiVersion: v1
kind: Secret
metadata:
  name: env-booking-api-secrets
  namespace: astrolumina-dev
  labels:
    app.kubernetes.io/name: booking-api
    app.kubernetes.io/part-of: astrolumina
    environment: development
type: Opaque
stringData:
  CALCOM_API_KEY: REPLACE_WITH_CALCOM_API_KEY
  RESEND_API_KEY: REPLACE_WITH_RESEND_API_KEY
  D1_ACCOUNT_ID: REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID
  D1_API_TOKEN: REPLACE_WITH_CLOUDFLARE_API_TOKEN
  D1_DATABASE_ID: REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID
  BOOKING_API_SENTRY_DSN: https://REPLACE_WITH_DEV_BOOKING_SENTRY_DSN@sentry.io/0
---
apiVersion: v1
kind: Secret
metadata:
  name: env-payment-api-secrets
  namespace: astrolumina-dev
  labels:
    app.kubernetes.io/name: payment-api
    app.kubernetes.io/part-of: astrolumina
    environment: development
type: Opaque
stringData:
  STRIPE_SK: REPLACE_WITH_STRIPE_TEST_SECRET_KEY
  PAYMENT_API_SENTRY_DSN: https://REPLACE_WITH_DEV_PAYMENT_SENTRY_DSN@sentry.io/0
  STRIPE_SOARELE_STRALUCIREA_TA: price_REPLACE_ME
  STRIPE_GHID_SATURN_IN_BERBEC: price_REPLACE_ME
  STRIPE_ASTROGRAMA_NATALA_SI_KARMICA: price_REPLACE_ME
  STRIPE_ASTROGRAMA_RELATIONALA: price_REPLACE_ME
  STRIPE_ASTROGRAMA_PREVIZIONALA: price_REPLACE_ME
  STRIPE_EVENIMENT_CONSTELATII: price_REPLACE_ME
