apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: astrolumina-dev
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: frontend
    environment: development
spec:
  # NodePort replaces the Compose port publishing: no Traefik in dev, the
  # laptop browser reaches the frontend directly at <node-ip>:30080.
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
