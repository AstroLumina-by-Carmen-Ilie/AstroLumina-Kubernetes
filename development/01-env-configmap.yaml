---
# Shared environment for all apps (mirrors the Docker Compose dev .env).
# Service DNS names are the in-cluster Service short names because in dev
# there is no Traefik and pods talk to each other directly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: env
  namespace: astrolumina-dev
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: development
data:
  NODE_ENV: development
  FRONTEND_SERVER_PORT: "80"
  FRONTEND_SERVER_DNS: frontend
  ASTROLOGY_API_SERVER_PORT: "3031"
  ASTROLOGY_API_SERVER_DNS: astrology-api
  BOOKING_API_SERVER_PORT: "3033"
  BOOKING_API_SERVER_DNS: booking-api
  PAYMENT_API_SERVER_PORT: "3032"
  PAYMENT_API_SERVER_DNS: payment-api
  # Optional: extra browser origins for CORS (the app always allows the
  # composed FRONTEND_SERVER_DNS:PORT origin). Replace NODE_IP with the RKE2
  # node IP so the laptop browser can call the APIs via NodePorts.
  CORS_ORIGINS: http://NODE_IP:30080,http://NODE_IP:30301,http://NODE_IP:30302,http://NODE_IP:30303
---
# Frontend runtime config. The image entrypoint (docker-entrypoint.sh) injects
# these Compose-style variables into public/env.js - VITE_* names are NOT read.
# Browser-facing API URLs must be reachable from the laptop, hence NODE_IP.
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-frontend
  namespace: astrolumina-dev
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: astrolumina
    environment: development
data:
  ASTROLOGICAL_API_URL: http://NODE_IP:30301
  PAYMENT_API_URL: http://NODE_IP:30302
  BOOKING_API_URL: http://NODE_IP:30303
  STRIPE_PK: pk_test_REPLACE_WITH_DEV_PUBLISHABLE_KEY
  R2_BASE_URL: https://pub-e5fdbdb03ff9453eb87c1b4c2f74d435.r2.dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-astrology-api
  namespace: astrolumina-dev
  labels:
    app.kubernetes.io/name: astrology-api
    app.kubernetes.io/part-of: astrolumina
    environment: development
data:
  ASTROLOGER_API_URL: https://astrologer.p.rapidapi.com
  ASTROLOGER_API_HOST: astrologer.p.rapidapi.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-booking-api
  namespace: astrolumina-dev
  labels:
    app.kubernetes.io/name: booking-api
    app.kubernetes.io/part-of: astrolumina
    environment: development
data:
  CALCOM_BASE_URL: https://api.cal.com
  R2_BASE_URL: https://pub-e5fdbdb03ff9453eb87c1b4c2f74d435.r2.dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-payment-api
  namespace: astrolumina-dev
  labels:
    app.kubernetes.io/name: payment-api
    app.kubernetes.io/part-of: astrolumina
    environment: development
data:
  STRIPE_API_VER: 2025-10-29.clover
