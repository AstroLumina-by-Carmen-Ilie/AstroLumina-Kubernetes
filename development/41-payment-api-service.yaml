apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: astrolumina-dev
  labels:
    app.kubernetes.io/name: payment-api
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: payment-api
    environment: development
spec:
  # NodePort so the laptop browser can call the API at <node-ip>:30302.
  type: NodePort
  ports:
    - name: http
      port: 3032
      targetPort: http
      nodePort: 30302
      protocol: TCP
  selector:
    app.kubernetes.io/name: payment-api
    app.kubernetes.io/component: payment-api
