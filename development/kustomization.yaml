apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: astrolumina-dev

resources:
  - 00-namespace.yaml
  - 01-env-configmap.yaml
  - 02-secrets.yaml
  - 03-doppler-secrets.yaml
  - 10-frontend-deployment.yaml
  - 11-frontend-service.yaml
  - 20-astrology-api-deployment.yaml
  - 21-astrology-api-service.yaml
  - 30-booking-api-deployment.yaml
  - 31-booking-api-service.yaml
  - 40-payment-api-deployment.yaml
  - 41-payment-api-service.yaml
  # No Ingress in development: no Traefik here (mirrors the Compose dev
  # setup). Services are NodePorts reached directly from the LAN.
  - 60-network-policy.yaml
  - 70-hpa.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: astrolumina
