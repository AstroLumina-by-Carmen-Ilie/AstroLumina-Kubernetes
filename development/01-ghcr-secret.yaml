---
# GHCR pull secret for development (placeholder only — mirrors the
# 02-secrets.yaml pattern). Every Deployment references it via
# `imagePullSecrets: [{name: ghcr-secret}]`, so pods fail with
# ImagePullBackOff until the REAL secret exists.
#
# Real credentials are NEVER committed. They already live in Doppler as
# GITHUB_USER / GITHUB_TOKEN / GITHUB_EMAIL (config `dev`). Create/replace
# the secret imperatively after each cluster rebuild (see
# development/README.md — zero copy-paste, values come from Doppler CLI
# on your LAPTOP, kubectl runs on the CP via ssh):
#
#   export K8S_CP_CONN=$(doppler secrets get K8S_CP_CONN --plain --project astrolumina --config dev)
#   export GITHUB_USER=$(doppler secrets get GITHUB_USER --plain --project astrolumina --config dev)
#   export GITHUB_TOKEN=$(doppler secrets get GITHUB_TOKEN --plain --project astrolumina --config dev)
#   export GITHUB_EMAIL=$(doppler secrets get GITHUB_EMAIL --plain --project astrolumina --config dev)
#   ssh "$K8S_CP_CONN" -- 'kubectl create secret docker-registry ghcr-secret -n astrolumina-dev --docker-server=ghcr.io --docker-username='"$GITHUB_USER"' --docker-password='"$GITHUB_TOKEN"' --docker-email='"$GITHUB_EMAIL"' --dry-run=client -o yaml | kubectl apply -f -'
#   unset GITHUB_TOKEN GITHUB_USER GITHUB_EMAIL
#
# NOTE: this cannot be managed by the Doppler operator (DopplerSecret syncs
# Opaque secrets, while a pull secret must be
# type: kubernetes.io/dockerconfigjson), hence the imperative flow — same as
# doppler-token-dev.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: astrolumina-dev
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: development
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"REPLACE_WITH_GITHUB_USER","password":"REPLACE_WITH_GITHUB_TOKEN","email":"admin@astrolumina.com","auth":"UkVQTEFDRV9XSVRIX0dJVEhVQl9VU0VSOlJFUExBQ0VfV0lUSF9HSVRIVUJfVE9LRU4="}}}'
