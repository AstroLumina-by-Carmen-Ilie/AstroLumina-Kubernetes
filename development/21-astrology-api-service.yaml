apiVersion: v1
kind: Service
metadata:
  name: astrology-api
  namespace: astrolumina-dev
  labels:
    app.kubernetes.io/name: astrology-api
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: astrology-api
    environment: development
spec:
  # NodePort so the laptop browser can call the API at <node-ip>:30301.
  type: NodePort
  ports:
    - name: http
      port: 3031
      targetPort: http
      nodePort: 30301
      protocol: TCP
  selector:
    app.kubernetes.io/name: astrology-api
    app.kubernetes.io/component: astrology-api
