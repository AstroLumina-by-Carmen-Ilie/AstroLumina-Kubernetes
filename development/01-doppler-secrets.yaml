---
# Doppler sync wiring for the development environment. These DopplerSecrets
# live here so `kubectl apply -k /mnt/k8s/development` (run on the CP via ssh)
# brings up everything at once. They reference a token Secret that is NOT
# committed to git. Create it once per cluster rebuild — exports on your
# LAPTOP, kubectl on the CP:
#   export K8S_CP_CONN=$(doppler secrets get K8S_CP_CONN --plain --project astrolumina --config dev)
#   export DOPPLER_SERVICE_TOKEN=$(doppler secrets get DOPPLER_SERVICE_TOKEN --plain --project astrolumina --config dev)
#   ssh "$K8S_CP_CONN" -- 'kubectl create secret generic doppler-token-dev -n doppler-operator-system --from-literal=serviceToken='"$DOPPLER_SERVICE_TOKEN"' --dry-run=client -o yaml | kubectl apply -f -'
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: astrolumina-dev-frontend
  namespace: doppler-operator-system
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: development
spec:
  project: astrolumina
  config: dev
  tokenSecret:
    name: doppler-token-dev
    namespace: doppler-operator-system
  managedSecret:
    name: env-frontend-secrets
    namespace: astrolumina-dev
  # Sync only the keys this Secret needs (DOPPLER_* metadata keys are added
  # by the operator on top; the pods simply ignore them).
  secrets:
    - NODE_ENV
    - FRONTEND_SERVER_PORT
    - FRONTEND_SENTRY_DSN
    - STRIPE_PK
    - R2_BASE_URL
    - ASTROLOGY_API_K8S_URL
    - PAYMENT_API_K8S_URL
    - BOOKING_API_K8S_URL
    - ASTROLOGY_API_SERVER_DC_PORT
    - ASTROLOGY_API_SERVER_DC_DNS
    - ASTROLOGY_API_SERVER_K8S_PORT
    - ASTROLOGY_API_SERVER_K8S_DNS
    - BOOKING_API_SERVER_DC_PORT
    - BOOKING_API_SERVER_DC_DNS
    - BOOKING_API_SERVER_K8S_PORT
    - BOOKING_API_SERVER_K8S_DNS
    - PAYMENT_API_SERVER_DC_PORT
    - PAYMENT_API_SERVER_DC_DNS
    - PAYMENT_API_SERVER_K8S_PORT
    - PAYMENT_API_SERVER_K8S_DNS
    - FRONTEND_SERVER_DC_PORT
    - FRONTEND_SERVER_DC_DNS
    - FRONTEND_SERVER_K8S_PORT
    - FRONTEND_SERVER_K8S_DNS
