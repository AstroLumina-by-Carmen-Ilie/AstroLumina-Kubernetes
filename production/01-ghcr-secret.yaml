---
# GHCR pull secret for production (placeholder only — mirrors the
# 02-secrets.yaml pattern). Every blue/green Deployment references it via
# `imagePullSecrets: [{name: ghcr-secret}]`, so pods fail with
# ImagePullBackOff until the REAL secret exists.
#
# Real credentials are NEVER committed. They already live in Doppler as
# GITHUB_USER / GITHUB_TOKEN (config `prd`). Create/replace the secret
# imperatively after each cluster rebuild (see production/README.md):
#
#   kubectl create secret docker-registry ghcr-secret \
#     -n astrolumina-prod \
#     --docker-server=ghcr.io \
#     --docker-username='<GITHUB_USER>' \
#     --docker-password='<GITHUB_TOKEN>' \
#     --docker-email='admin@astrolumina.com' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# NOTE: this cannot be managed by the Doppler operator (DopplerSecret syncs
# Opaque secrets, while a pull secret must be
# type: kubernetes.io/dockerconfigjson), hence the imperative flow — same as
# doppler-token-prd.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: astrolumina-prod
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: production
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"REPLACE_WITH_GITHUB_USER","password":"REPLACE_WITH_GITHUB_TOKEN","email":"admin@astrolumina.com","auth":"UkVQTEFDRV9XSVRIX0dJVEhVQl9VU0VSOlJFUExBQ0VfV0lUSF9HSVRIVUJfVE9LRU4="}}}'
