apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-api-blue
  namespace: astrolumina-prod
  # Let the Doppler operator restart the pods automatically when a synced secret changes.
  annotations:
    secrets.doppler.com/reload: "true"
  labels:
    app.kubernetes.io/name: booking-api
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: booking-api
    environment: production
    variant: blue
spec:
  # 3 replicas to mirror the Compose production blue service.
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: booking-api
      app.kubernetes.io/component: booking-api
      variant: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: booking-api
        app.kubernetes.io/part-of: astrolumina
        app.kubernetes.io/component: booking-api
        environment: production
        variant: blue
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # Blue runs on worker-01, green on worker-02 (see README): together
      # with the CP taint this keeps app pods off the control plane.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - rke2-worker-daniel-pirvu-01
      containers:
        - name: booking-api
          image: ghcr.io/astrolumina-by-carmen-ilie/astrolumina-bookingapi:2.0.10
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3033
              protocol: TCP
          # Full variable set from src/config/env.ts (the app exits at startup
          # if any required variable is missing; PORT alone is not read).
          env:
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: NODE_ENV
            - name: BOOKING_API_SERVER_PORT
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: BOOKING_API_SERVER_PORT
            - name: BOOKING_API_SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: BOOKING_API_SENTRY_DSN
            - name: CORS_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: CORS_ORIGINS
                  optional: true
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: RESEND_API_KEY
            - name: CALCOM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: CALCOM_API_KEY
            - name: CALCOM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: CALCOM_BASE_URL
            - name: R2_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: R2_BASE_URL
            - name: D1_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: D1_ACCOUNT_ID
            - name: D1_DATABASE_ID
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: D1_DATABASE_ID
            - name: D1_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: D1_API_TOKEN
            - name: ASTROLOGY_API_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: ASTROLOGY_API_SERVER_DC_PORT
            - name: ASTROLOGY_API_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: ASTROLOGY_API_SERVER_DC_DNS
            - name: ASTROLOGY_API_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: ASTROLOGY_API_SERVER_K8S_PORT
            - name: ASTROLOGY_API_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: ASTROLOGY_API_SERVER_K8S_DNS
            - name: BOOKING_API_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: BOOKING_API_SERVER_DC_PORT
            - name: BOOKING_API_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: BOOKING_API_SERVER_DC_DNS
            - name: BOOKING_API_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: BOOKING_API_SERVER_K8S_PORT
            - name: BOOKING_API_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: BOOKING_API_SERVER_K8S_DNS
            - name: PAYMENT_API_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: PAYMENT_API_SERVER_DC_PORT
            - name: PAYMENT_API_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: PAYMENT_API_SERVER_DC_DNS
            - name: PAYMENT_API_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: PAYMENT_API_SERVER_K8S_PORT
            - name: PAYMENT_API_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: PAYMENT_API_SERVER_K8S_DNS
            - name: FRONTEND_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: FRONTEND_SERVER_DC_PORT
            - name: FRONTEND_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: FRONTEND_SERVER_DC_DNS
            - name: FRONTEND_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: FRONTEND_SERVER_K8S_PORT
            - name: FRONTEND_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-booking-api-secrets
                  key: FRONTEND_SERVER_K8S_DNS
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
      restartPolicy: Always
