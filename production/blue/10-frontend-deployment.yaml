apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-blue
  namespace: astrolumina-prod
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: frontend
    environment: production
    variant: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/component: frontend
      variant: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: astrolumina
        app.kubernetes.io/component: frontend
        environment: production
        variant: blue
    spec:
      containers:
        - name: frontend
          image: ghcr.io/astrolumina-by-carmen-ilie/astrolumina-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: VITE_NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: env-frontend
                  key: VITE_NODE_ENV
            - name: VITE_DEBUG_MODE
              valueFrom:
                configMapKeyRef:
                  name: env-frontend
                  key: VITE_DEBUG_MODE
            - name: VITE_ASTROLOGICAL_API_URL
              valueFrom:
                configMapKeyRef:
                  name: env-frontend
                  key: VITE_ASTROLOGICAL_API_URL
            - name: VITE_PAYMENT_API_URL
              valueFrom:
                configMapKeyRef:
                  name: env-frontend
                  key: VITE_PAYMENT_API_URL
            - name: VITE_BOOKING_API_URL
              valueFrom:
                configMapKeyRef:
                  name: env-frontend
                  key: VITE_BOOKING_API_URL
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
      restartPolicy: Always
