apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: intentionally no top-level "namespace:" here. Every resource file
# carries its own explicit namespace (the kustomize namespace transformer
# would override file-level namespaces).

resources:
  - 10-frontend-deployment.yaml
  - 11-frontend-service.yaml
  - 20-astrology-api-deployment.yaml
  - 21-astrology-api-service.yaml
  - 30-booking-api-deployment.yaml
  - 31-booking-api-service.yaml
  - 40-payment-api-deployment.yaml
  - 41-payment-api-service.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: astrolumina
  variant: blue
