---
# Doppler sync wiring for the production environment. These DopplerSecrets live
# here so `kubectl apply -k production/` brings up everything at once. They
# reference a token Secret that is NOT committed to git. Create it once per
# cluster rebuild with:
#   kubectl create secret generic doppler-token-prd -n doppler-operator-system \
#     --from-literal=serviceToken='<paste-production-service-token>'
# First boot still uses the 02-secrets.yaml placeholders; after the sync is
# verified, drop 02-secrets.yaml from kustomization.yaml and re-apply.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: astrolumina-production-frontend
  namespace: doppler-operator-system
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: production
spec:
  project: astrolumina
  config: prd
  tokenSecret:
    name: doppler-token-prd
    namespace: doppler-operator-system
  managedSecret:
    name: env-frontend-secrets
    namespace: astrolumina-prod
  # Sync only the keys this Secret needs (DOPPLER_* metadata keys are added
  # by the operator on top; the pods simply ignore them).
  secrets:
    - NODE_ENV
    - FRONTEND_SERVER_PORT
    - FRONTEND_SERVER_DNS
    - ASTROLOGY_API_SERVER_PORT
    - ASTROLOGY_API_SERVER_DNS
    - BOOKING_API_SERVER_PORT
    - BOOKING_API_SERVER_DNS
    - PAYMENT_API_SERVER_PORT
    - PAYMENT_API_SERVER_DNS
    - CORS_ORIGINS
    - ASTROLOGICAL_API_URL
    - PAYMENT_API_URL
    - BOOKING_API_URL
    - STRIPE_PK
    - R2_BASE_URL
    - FRONTEND_SENTRY_DSN
