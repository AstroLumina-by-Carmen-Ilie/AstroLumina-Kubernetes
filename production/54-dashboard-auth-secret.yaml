---
# Credentials for the Traefik dashboard basicAuth middleware (mirrors
# TRAEFIK_DASHBOARD_AUTH from the Compose production .env). Generate the real
# value with: htpasswd -nbB admin '<password>', then paste the resulting
# admin:$2y$... line below as-is (stringData takes plain text).
apiVersion: v1
kind: Secret
metadata:
  name: traefik-dashboard-auth
  namespace: astrolumina-prod
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: production
type: Opaque
stringData:
  users: REPLACE_WITH_HTPASSWD_LINE_FOR_DASHBOARD
