---
# Doppler sync wiring for the production environment. These DopplerSecrets live
# here so `kubectl apply -k /mnt/k8s/production` (run on the CP via ssh) brings
# up everything at once. They reference a token Secret that is NOT committed
# to git. Create it once per cluster rebuild — exports on your LAPTOP,
# kubectl on the CP:
#   export K8S_CP_CONN=$(doppler secrets get K8S_CP_CONN --plain --project astrolumina --config prd)
#   export K8S_SERVICE_TOKEN=$(doppler secrets get K8S_SERVICE_TOKEN --plain --project astrolumina --config prd)
#   ssh "$K8S_CP_CONN" -- 'kubectl create secret generic doppler-token-prd -n doppler-operator-system --from-literal=serviceToken='"$K8S_SERVICE_TOKEN"' --dry-run=client -o yaml | kubectl apply -f -'
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: astrolumina-production-frontend
  namespace: doppler-operator-system
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: production
spec:
  project: astrolumina
  config: prd
  tokenSecret:
    name: doppler-token-prd
    namespace: doppler-operator-system
  managedSecret:
    name: env-frontend-secrets
    namespace: astrolumina-prod
  # Sync only the keys this Secret needs (DOPPLER_* metadata keys are added
  # by the operator on top; the pods simply ignore them).
  secrets:
    - NODE_ENV
    - FRONTEND_SERVER_PORT
    - FRONTEND_SERVER_DNS
    - ASTROLOGY_API_SERVER_PORT
    - ASTROLOGY_API_SERVER_DNS
    - BOOKING_API_SERVER_PORT
    - BOOKING_API_SERVER_DNS
    - PAYMENT_API_SERVER_PORT
    - PAYMENT_API_SERVER_DNS
    - FRONTEND_SERVER_K8S_PORT
    - ASTROLOGY_API_SERVER_K8S_PORT
    - BOOKING_API_SERVER_K8S_PORT
    - PAYMENT_API_SERVER_K8S_PORT
    - CORS_ORIGINS
    - ASTROLOGICAL_API_URL
    - PAYMENT_API_URL
    - BOOKING_API_URL
    - STRIPE_PK
    - R2_BASE_URL
    - FRONTEND_SENTRY_DSN
    # K8s-reachable endpoints read by the frontend Deployment under the
    # app-facing names (env NAME stays X_API_URL, secret KEY is X_K8S_URL).
    - ASTROLOGICAL_API_K8S_URL
    - PAYMENT_API_K8S_URL
    - BOOKING_API_K8S_URL
