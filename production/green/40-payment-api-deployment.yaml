apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api-green
  namespace: astrolumina-prod
  # Let the Doppler operator restart the pods automatically when a synced secret changes.
  annotations:
    secrets.doppler.com/reload: "true"
  labels:
    app.kubernetes.io/name: payment-api
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: payment-api
    environment: production
    variant: green
spec:
  # 3 replicas to mirror the Compose production green service.
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-api
      app.kubernetes.io/component: payment-api
      variant: green
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-api
        app.kubernetes.io/part-of: astrolumina
        app.kubernetes.io/component: payment-api
        environment: production
        variant: green
    spec:
      containers:
        - name: payment-api
          image: ghcr.io/astrolumina-by-carmen-ilie/astrolumina-paymentapi:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3032
              protocol: TCP
          # Full variable set from src/config/env.ts (the app exits at startup
          # if any required variable is missing; PORT alone is not read).
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: NODE_ENV
            - name: FRONTEND_SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: FRONTEND_SERVER_PORT
            - name: FRONTEND_SERVER_DNS
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: FRONTEND_SERVER_DNS
            - name: ASTROLOGY_API_SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: ASTROLOGY_API_SERVER_PORT
            - name: ASTROLOGY_API_SERVER_DNS
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: ASTROLOGY_API_SERVER_DNS
            - name: BOOKING_API_SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: BOOKING_API_SERVER_PORT
            - name: BOOKING_API_SERVER_DNS
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: BOOKING_API_SERVER_DNS
            - name: PAYMENT_API_SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: PAYMENT_API_SERVER_PORT
            - name: PAYMENT_API_SERVER_DNS
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: PAYMENT_API_SERVER_DNS
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: CORS_ORIGINS
            - name: STRIPE_API_VER
              valueFrom:
                configMapKeyRef:
                  name: env-payment-api
                  key: STRIPE_API_VER
            - name: STRIPE_SOARELE_STRALUCIREA_TA
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: STRIPE_SOARELE_STRALUCIREA_TA
            - name: STRIPE_GHID_SATURN_IN_BERBEC
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: STRIPE_GHID_SATURN_IN_BERBEC
            - name: STRIPE_ASTROGRAMA_NATALA_SI_KARMICA
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: STRIPE_ASTROGRAMA_NATALA_SI_KARMICA
            - name: STRIPE_ASTROGRAMA_RELATIONALA
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: STRIPE_ASTROGRAMA_RELATIONALA
            - name: STRIPE_ASTROGRAMA_PREVIZIONALA
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: STRIPE_ASTROGRAMA_PREVIZIONALA
            - name: STRIPE_EVENIMENT_CONSTELATII
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: STRIPE_EVENIMENT_CONSTELATII
            - name: STRIPE_SK
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: STRIPE_SK
            - name: PAYMENT_API_SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: PAYMENT_API_SENTRY_DSN
          resources:
            requests:
              cpu: 125m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
      restartPolicy: Always
