---
# Shared environment (mirrors the Docker Compose staging .env in Doppler).
# DNS names are the public host because Traefik terminates the single host
# and the apps use these values for CORS origins and CSP headers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: env
  namespace: astrolumina-staging
  labels:
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: config
    environment: staging
data:
  NODE_ENV: "staging"
  FRONTEND_SERVER_PORT: "80"
  FRONTEND_SERVER_DNS: staging.astrolumina.ro
  ASTROLOGY_API_SERVER_PORT: "3031"
  ASTROLOGY_API_SERVER_DNS: staging.astrolumina.ro
  BOOKING_API_SERVER_PORT: "3033"
  BOOKING_API_SERVER_DNS: staging.astrolumina.ro
  PAYMENT_API_SERVER_PORT: "3032"
  PAYMENT_API_SERVER_DNS: staging.astrolumina.ro
  CORS_ORIGINS: https://staging.astrolumina.ro
---
# Frontend runtime config. The image entrypoint (docker-entrypoint.sh) injects
# these Compose-style variables into public/env.js - VITE_* names are NOT read.
# Staging is plain HTTP behind Traefik (entryPoint web, no TLS).
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-frontend
  namespace: astrolumina-staging
  labels:
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: frontend
    environment: staging
data:
  ASTROLOGICAL_API_URL: "http://staging.astrolumina.ro/api/astrology"
  PAYMENT_API_URL: "http://staging.astrolumina.ro/api/payment"
  BOOKING_API_URL: "http://staging.astrolumina.ro/api/booking"
  STRIPE_PK: "pk_test_REPLACE_WITH_STAGING_PUBLISHABLE_KEY"
  R2_BASE_URL: "https://pub-3a468a81beab43daa28dba00d60409d6.r2.dev/pdfs"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-astrology-api
  namespace: astrolumina-staging
  labels:
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: astrology-api
    environment: staging
data:
  ASTROLOGER_API_URL: "https://astrologer.p.rapidapi.com"
  ASTROLOGER_API_HOST: "astrologer.p.rapidapi.com"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-booking-api
  namespace: astrolumina-staging
  labels:
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: booking-api
    environment: staging
data:
  CALCOM_BASE_URL: "https://api.cal.com"
  R2_BASE_URL: "https://pub-3a468a81beab43daa28dba00d60409d6.r2.dev/pdfs"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-payment-api
  namespace: astrolumina-staging
  labels:
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: payment-api
    environment: staging
data:
  STRIPE_API_VER: "2025-01-27.acacia"
