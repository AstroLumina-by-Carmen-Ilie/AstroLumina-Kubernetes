apiVersion: apps/v1
kind: Deployment
metadata:
  name: astrology-api-green
  namespace: astrolumina-staging
  labels:
    app.kubernetes.io/name: astrology-api
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: astrology-api
    environment: staging
    variant: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: astrology-api
      app.kubernetes.io/component: astrology-api
      variant: green
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astrology-api
        app.kubernetes.io/part-of: astrolumina
        app.kubernetes.io/component: astrology-api
        environment: staging
        variant: green
    spec:
      containers:
        - name: astrology-api
          image: ghcr.io/astrolumina-by-carmen-ilie/astrolumina-astrologyapi:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3031
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "staging"
            - name: PORT
              value: "3031"
            - name: ASTROLOGER_API_URL
              valueFrom:
                configMapKeyRef:
                  name: env-astrology-api
                  key: ASTROLOGER_API_URL
            - name: ASTROLOGER_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: env-astrology-api
                  key: ASTROLOGER_API_HOST
            - name: ASTROLOGER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: env-astrology-api-secrets
                  key: ASTROLOGER_API_KEY
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: env-astrology-api-secrets
                  key: SENTRY_DSN
          resources:
            requests:
              cpu: 125m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
      restartPolicy: Always
