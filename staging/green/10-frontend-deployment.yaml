apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-green
  namespace: astrolumina-staging
  # Let the Doppler operator restart the pods automatically when a synced secret changes.
  annotations:
    secrets.doppler.com/reload: "true"
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: frontend
    environment: staging
    variant: green
spec:
  # 3 replicas to mirror the Compose staging green service.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/component: frontend
      variant: green
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: astrolumina
        app.kubernetes.io/component: frontend
        environment: staging
        variant: green
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # Blue runs on worker-01, green on worker-02 (see README): together
      # with the CP taint this keeps app pods off the control plane.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - rke2-worker-daniel-pirvu-02
      containers:
        - name: frontend
          image: ghcr.io/astrolumina-by-carmen-ilie/astrolumina-frontend:2.0.9
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # The image entrypoint injects these Compose-style variables into
          # public/env.js at container start. VITE_* names are NOT read.
          env:
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: NODE_ENV
            - name: FRONTEND_SERVER_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: FRONTEND_SERVER_PORT
            - name: FRONTEND_SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: FRONTEND_SENTRY_DSN
            - name: STRIPE_PK
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: STRIPE_PK
            - name: R2_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: R2_BASE_URL
            - name: ASTROLOGY_API_URL
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: ASTROLOGY_API_K8S_URL
            - name: PAYMENT_API_URL
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: PAYMENT_API_K8S_URL
            - name: BOOKING_API_URL
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: BOOKING_API_K8S_URL
            - name: ASTROLOGY_API_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: ASTROLOGY_API_SERVER_DC_PORT
            - name: ASTROLOGY_API_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: ASTROLOGY_API_SERVER_DC_DNS
            - name: ASTROLOGY_API_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: ASTROLOGY_API_SERVER_K8S_PORT
            - name: ASTROLOGY_API_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: ASTROLOGY_API_SERVER_K8S_DNS
            - name: BOOKING_API_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: BOOKING_API_SERVER_DC_PORT
            - name: BOOKING_API_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: BOOKING_API_SERVER_DC_DNS
            - name: BOOKING_API_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: BOOKING_API_SERVER_K8S_PORT
            - name: BOOKING_API_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: BOOKING_API_SERVER_K8S_DNS
            - name: PAYMENT_API_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: PAYMENT_API_SERVER_DC_PORT
            - name: PAYMENT_API_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: PAYMENT_API_SERVER_DC_DNS
            - name: PAYMENT_API_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: PAYMENT_API_SERVER_K8S_PORT
            - name: PAYMENT_API_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: PAYMENT_API_SERVER_K8S_DNS
            - name: FRONTEND_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: FRONTEND_SERVER_DC_PORT
            - name: FRONTEND_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: FRONTEND_SERVER_DC_DNS
            - name: FRONTEND_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: FRONTEND_SERVER_K8S_PORT
            - name: FRONTEND_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: FRONTEND_SERVER_K8S_DNS
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
      restartPolicy: Always
