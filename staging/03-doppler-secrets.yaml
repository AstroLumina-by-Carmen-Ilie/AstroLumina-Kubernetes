---
# Doppler sync wiring for the staging environment. These DopplerSecrets live
# here so `kubectl apply -k /mnt/k8s/staging` (run on the CP via ssh) brings
# up everything at once. They reference a token Secret that is NOT committed
# to git. Create it once per cluster rebuild — exports on your LAPTOP,
# kubectl on the CP:
#   export K8S_CP_CONN=$(doppler secrets get K8S_CP_CONN --plain --project astrolumina --config stg)
#   ssh "$K8S_CP_CONN" -- 'kubectl create secret generic doppler-token-stg -n doppler-operator-system --from-literal=serviceToken='"$K8S_SERVICE_TOKEN"' --dry-run=client -o yaml | kubectl apply -f -'
# First boot still uses the 02-secrets.yaml placeholders; after the sync is
# verified, drop 02-secrets.yaml from kustomization.yaml and re-apply.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: astrolumina-staging-frontend
  namespace: doppler-operator-system
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: staging
spec:
  project: astrolumina
  config: stg
  tokenSecret:
    name: doppler-token-stg
    namespace: doppler-operator-system
  managedSecret:
    name: env-frontend-secrets
    namespace: astrolumina-staging
  # Sync only the keys this Secret needs (DOPPLER_* metadata keys are added
  # by the operator on top; the pods simply ignore them).
  secrets:
    - NODE_ENV
    - FRONTEND_SERVER_PORT
    - FRONTEND_SERVER_DNS
    - ASTROLOGY_API_SERVER_PORT
    - ASTROLOGY_API_SERVER_DNS
    - BOOKING_API_SERVER_PORT
    - BOOKING_API_SERVER_DNS
    - PAYMENT_API_SERVER_PORT
    - PAYMENT_API_SERVER_DNS
    - CORS_ORIGINS
    - ASTROLOGICAL_API_URL
    - PAYMENT_API_URL
    - BOOKING_API_URL
    - STRIPE_PK
    - R2_BASE_URL
    - FRONTEND_SENTRY_DSN
