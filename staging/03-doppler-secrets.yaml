---
# Doppler sync wiring for the staging environment. These DopplerSecrets live
# here so `kubectl apply -k staging/` brings up everything at once. They
# reference a token Secret that is NOT committed to git. Create it once per
# cluster rebuild with:
#   kubectl create secret generic doppler-token-stg -n doppler-operator-system \
#     --from-literal=serviceToken='<paste-staging-service-token>'
# First boot still uses the 02-secrets.yaml placeholders; after the sync is
# verified, drop 02-secrets.yaml from kustomization.yaml and re-apply.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: astrolumina-staging-frontend
  namespace: doppler-operator-system
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: staging
spec:
  project: astrolumina
  config: stg
  tokenSecret:
    name: doppler-token-stg
    namespace: doppler-operator-system
  managedSecret:
    name: env-frontend-secrets
    namespace: astrolumina-staging
  # Sync only the keys this Secret needs (DOPPLER_* metadata keys are added
  # by the operator on top; the pods simply ignore them).
  secrets:
    - FRONTEND_SENTRY_DSN
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: astrolumina-staging-astrology-api
  namespace: doppler-operator-system
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: staging
spec:
  project: astrolumina
  config: stg
  tokenSecret:
    name: doppler-token-stg
    namespace: doppler-operator-system
  managedSecret:
    name: env-astrology-api-secrets
    namespace: astrolumina-staging
  secrets:
    - ASTROLOGER_API_KEY
    - ASTROLOGY_API_SENTRY_DSN
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: astrolumina-staging-booking-api
  namespace: doppler-operator-system
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: staging
spec:
  project: astrolumina
  config: stg
  tokenSecret:
    name: doppler-token-stg
    namespace: doppler-operator-system
  managedSecret:
    name: env-booking-api-secrets
    namespace: astrolumina-staging
  secrets:
    - CALCOM_API_KEY
    - RESEND_API_KEY
    - D1_ACCOUNT_ID
    - D1_API_TOKEN
    - D1_DATABASE_ID
    - BOOKING_API_SENTRY_DSN
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: astrolumina-staging-payment-api
  namespace: doppler-operator-system
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: staging
spec:
  project: astrolumina
  config: stg
  tokenSecret:
    name: doppler-token-stg
    namespace: doppler-operator-system
  managedSecret:
    name: env-payment-api-secrets
    namespace: astrolumina-staging
  secrets:
    - STRIPE_SK
    - PAYMENT_API_SENTRY_DSN
    - STRIPE_SOARELE_STRALUCIREA_TA
    - STRIPE_GHID_SATURN_IN_BERBEC
    - STRIPE_ASTROGRAMA_NATALA_SI_KARMICA
    - STRIPE_ASTROGRAMA_RELATIONALA
    - STRIPE_ASTROGRAMA_PREVIZIONALA
    - STRIPE_EVENIMENT_CONSTELATII
