apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api-blue
  namespace: astrolumina-staging
  # Let the Doppler operator restart the pods automatically when a synced secret changes.
  annotations:
    secrets.doppler.com/reload: "true"
  labels:
    app.kubernetes.io/name: payment-api
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: payment-api
    environment: staging
    variant: blue
spec:
  # 3 replicas to mirror the Compose staging blue service.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-api
      app.kubernetes.io/component: payment-api
      variant: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-api
        app.kubernetes.io/part-of: astrolumina
        app.kubernetes.io/component: payment-api
        environment: staging
        variant: blue
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # Blue runs on worker-01, green on worker-02 (see README): together
      # with the CP taint this keeps app pods off the control plane.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - rke2-worker-daniel-pirvu-01
      containers:
        - name: payment-api
          image: ghcr.io/astrolumina-by-carmen-ilie/astrolumina-paymentapi:2.0.10
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3032
              protocol: TCP
          # Full variable set from src/config/env.ts (the app exits at startup
          # if any required variable is missing; PORT alone is not read).
          env:
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: NODE_ENV
            - name: PAYMENT_API_SERVER_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: PAYMENT_API_SERVER_PORT
            - name: PAYMENT_API_SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: PAYMENT_API_SENTRY_DSN
            - name: CORS_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: CORS_ORIGINS
                  optional: true
            - name: STRIPE_SK
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: STRIPE_SK
            - name: STRIPE_API_VER
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: STRIPE_API_VER
            - name: STRIPE_SOARELE_STRALUCIREA_TA
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: STRIPE_SOARELE_STRALUCIREA_TA
            - name: STRIPE_GHID_SATURN_IN_BERBEC
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: STRIPE_GHID_SATURN_IN_BERBEC
            - name: STRIPE_ASTROGRAMA_NATALA_SI_KARMICA
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: STRIPE_ASTROGRAMA_NATALA_SI_KARMICA
            - name: STRIPE_ASTROGRAMA_RELATIONALA
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: STRIPE_ASTROGRAMA_RELATIONALA
            - name: STRIPE_ASTROGRAMA_PREVIZIONALA
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: STRIPE_ASTROGRAMA_PREVIZIONALA
            - name: STRIPE_EVENIMENT_CONSTELATII
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: STRIPE_EVENIMENT_CONSTELATII
            - name: ASTROLOGY_API_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: ASTROLOGY_API_SERVER_DC_PORT
            - name: ASTROLOGY_API_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: ASTROLOGY_API_SERVER_DC_DNS
            - name: ASTROLOGY_API_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: ASTROLOGY_API_SERVER_K8S_PORT
            - name: ASTROLOGY_API_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: ASTROLOGY_API_SERVER_K8S_DNS
            - name: BOOKING_API_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: BOOKING_API_SERVER_DC_PORT
            - name: BOOKING_API_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: BOOKING_API_SERVER_DC_DNS
            - name: BOOKING_API_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: BOOKING_API_SERVER_K8S_PORT
            - name: BOOKING_API_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: BOOKING_API_SERVER_K8S_DNS
            - name: PAYMENT_API_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: PAYMENT_API_SERVER_DC_PORT
            - name: PAYMENT_API_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: PAYMENT_API_SERVER_DC_DNS
            - name: PAYMENT_API_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: PAYMENT_API_SERVER_K8S_PORT
            - name: PAYMENT_API_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: PAYMENT_API_SERVER_K8S_DNS
            - name: FRONTEND_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: FRONTEND_SERVER_DC_PORT
            - name: FRONTEND_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: FRONTEND_SERVER_DC_DNS
            - name: FRONTEND_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: FRONTEND_SERVER_K8S_PORT
            - name: FRONTEND_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: FRONTEND_SERVER_K8S_DNS
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
      restartPolicy: Always
