---
# Single-host routing for staging, mirroring the Compose routers: one host
# (staging.astrolumina.ro), /api/* prefixes stripped before the apps, plain
# HTTP on entryPoint web (no TLS in staging). Traffic goes to the *-live
# Services; the blue-green switch flips the 4 selectors in 53-live-services.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: astrolumina
  namespace: astrolumina-staging
  # RKE2 Traefik only processes IngressRoutes carrying this class
  # (--providers.kubernetescrd.ingressClass=traefik); without it the route
  # is silently ignored and every request 404s. NOTE: the installed CRD
  # schema has no spec.ingressClassName field, so the (deprecated but still
  # honored) annotation is used instead.
  annotations:
    kubernetes.io/ingress.class: traefik
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: staging
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`staging.astrolumina.ro`) && PathPrefix(`/api/astrology`)
      kind: Rule
      middlewares:
        - name: security-headers
        - name: compress
        - name: strip-astrology
      services:
        - name: astrology-api-live
          port: 3031
    - match: Host(`staging.astrolumina.ro`) && PathPrefix(`/api/booking`)
      kind: Rule
      middlewares:
        - name: security-headers
        - name: compress
        - name: strip-booking
      services:
        - name: booking-api-live
          port: 3033
    - match: Host(`staging.astrolumina.ro`) && PathPrefix(`/api/payment`)
      kind: Rule
      middlewares:
        - name: security-headers
        - name: compress
        - name: strip-payment
      services:
        - name: payment-api-live
          port: 3032
    - match: Host(`staging.astrolumina.ro`)
      kind: Rule
      middlewares:
        - name: security-headers
        - name: compress
      services:
        - name: frontend-live
          port: 80
---
# Staging dashboard, same as the Compose staging dashboard router
# (Host dashboard.astrolumina.ro, no auth in staging).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: astrolumina-staging
  # Same ingressClass requirement as above (see NOTE on the main route).
  annotations:
    kubernetes.io/ingress.class: traefik
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: staging
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`dashboard.astrolumina.ro`)
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
