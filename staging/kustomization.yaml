apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: intentionally no top-level "namespace:" here. Every resource file
# carries its own explicit namespace, and a top-level value would also
# relocate the DopplerSecrets out of doppler-operator-system (the kustomize
# namespace transformer overrides file-level namespaces).

resources:
  - 00-namespace.yaml
  # - 01-ghcr-secret.yaml
  # - 02-secrets.yaml
  - 03-doppler-secrets.yaml
  - 51-middlewares.yaml
  - 52-ingressroute.yaml
  - 53-live-services.yaml
  - 60-network-policy.yaml
  - 70-hpa.yaml
  - blue
  - green

# NOTE: intentionally no commonLabels here (kustomize warns it is deprecated
# anyway). All selector-relevant labels (part-of, variant) are hardcoded in
# the manifests; the transformer additionally injected labels into
# NetworkPolicy peers and Deployment selectors, breaking DNS/ingress and
# making selector updates immutable.
