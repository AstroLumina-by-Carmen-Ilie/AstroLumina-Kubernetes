apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: intentionally no top-level "namespace:" here. Every resource file
# carries its own explicit namespace, and a top-level value would also
# relocate the DopplerSecrets out of doppler-operator-system (the kustomize
# namespace transformer overrides file-level namespaces).

resources:
  - 00-namespace.yaml
  - 01-ghcr-secret.yaml
  - 02-secrets.yaml
  - 03-doppler-secrets.yaml
  - 51-middlewares.yaml
  - 52-ingressroute.yaml
  - 53-live-services.yaml
  - 60-network-policy.yaml
  - 70-hpa.yaml
  - blue
  - green

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: astrolumina
