---
# Placeholder secrets for staging. Real values are injected by Doppler at
# deploy time (see 03-doppler-secrets.yaml). EVERY key listed in the
# DopplerSecret sync lists must exist here too — a missing key means
# CreateContainerConfigError (secretKeyRef is mandatory), NOT a running pod.
# Values are fake but format-plausible so the apps boot until Doppler syncs.
apiVersion: v1
kind: Secret
metadata:
  name: env-frontend-secrets
  namespace: astrolumina-staging
  labels:
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: frontend
    environment: staging
type: Opaque
stringData:
  NODE_ENV: "staging"
  FRONTEND_SERVER_PORT: "80"
  FRONTEND_SERVER_DNS: "your_frontend_dns_here"
  ASTROLOGY_API_SERVER_PORT: "3031"
  ASTROLOGY_API_SERVER_DNS: "your_astrology_dns_here"
  BOOKING_API_SERVER_PORT: "3033"
  BOOKING_API_SERVER_DNS: "your_booking_dns_here"
  PAYMENT_API_SERVER_PORT: "3032"
  PAYMENT_API_SERVER_DNS: "your_payment_dns_here"
  CORS_ORIGINS: "http://your_staging_host_here"
  ASTROLOGICAL_API_URL: "http://your_astrology_api_url_here"
  PAYMENT_API_URL: "http://your_payment_api_url_here"
  BOOKING_API_URL: "http://your_booking_api_url_here"
  ASTROLOGICAL_API_K8S_URL: "http://your_astrology_api_k8s_url_here"
  PAYMENT_API_K8S_URL: "http://your_payment_api_k8s_url_here"
  BOOKING_API_K8S_URL: "http://your_booking_api_k8s_url_here"
  STRIPE_PK: "your_stripe_pk_here"
  R2_BASE_URL: "http://your_r2_base_url_here"
  FRONTEND_SENTRY_DSN: "https://REPLACE_WITH_STAGING_FRONTEND_SENTRY_DSN@sentry.io/0"
