---
# Placeholder secrets for staging. Real values are injected by Doppler at
# deploy time (see doppler/staging-doppler-secret.yaml). Keys follow the exact
# environment variable names the apps validate at startup. STRIPE_PK was moved
# to the env-frontend ConfigMap (the payment API never reads it).
apiVersion: v1
kind: Secret
metadata:
  name: env-frontend-secrets
  namespace: astrolumina-staging
  labels:
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: frontend
    environment: staging
type: Opaque
stringData:
  FRONTEND_SENTRY_DSN: "https://REPLACE_WITH_STAGING_FRONTEND_SENTRY_DSN@sentry.io/0"
---
apiVersion: v1
kind: Secret
metadata:
  name: env-astrology-api-secrets
  namespace: astrolumina-staging
  labels:
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: astrology-api
    environment: staging
type: Opaque
stringData:
  ASTROLOGER_API_KEY: "your_astrologer_api_key_here"
  ASTROLOGY_API_SENTRY_DSN: "https://your_astrology_sentry_dsn_here"
---
apiVersion: v1
kind: Secret
metadata:
  name: env-booking-api-secrets
  namespace: astrolumina-staging
  labels:
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: booking-api
    environment: staging
type: Opaque
stringData:
  CALCOM_API_KEY: "your_calcom_api_key_here"
  RESEND_API_KEY: "your_resend_api_key_here"
  D1_ACCOUNT_ID: "your_d1_account_id_here"
  D1_API_TOKEN: "your_d1_api_token_here"
  D1_DATABASE_ID: "your_d1_database_id_here"
  BOOKING_API_SENTRY_DSN: "https://your_booking_sentry_dsn_here"
---
apiVersion: v1
kind: Secret
metadata:
  name: env-payment-api-secrets
  namespace: astrolumina-staging
  labels:
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: payment-api
    environment: staging
type: Opaque
stringData:
  STRIPE_SK: "sk_test_your_stripe_secret_here"
  PAYMENT_API_SENTRY_DSN: "https://your_payment_sentry_dsn_here"
  STRIPE_SOARELE_STRALUCIREA_TA: "price_test_your_price_id"
  STRIPE_GHID_SATURN_IN_BERBEC: "price_test_your_price_id"
  STRIPE_ASTROGRAMA_NATALA_SI_KARMICA: "price_test_your_price_id"
  STRIPE_ASTROGRAMA_RELATIONALA: "price_test_your_price_id"
  STRIPE_ASTROGRAMA_PREVIZIONALA: "price_test_your_price_id"
  STRIPE_EVENIMENT_CONSTELATII: "price_test_your_price_id"
